// APP ROOT
// ═══════════════════════════════════════════════════════════════
function App() {
  // ── Always start at login page — never restore session automatically ──
  const [currentUser, setCurrentUser] = useState(null);
  const [page, setPage]               = useState("dashboard");
  const [status, setStatus]           = useState(null);
  const [filters, setFilters]         = useState({agences:[],regions:[],branches:[]});
  const [fVals, setFVals]             = useState({agence:"all",region:"all",branche:"all",mois:0});
  const [conversations, setConversations] = useState([]);
  const [activeConvId, setActiveConvId]   = useState(null);

  const isAdmin = currentUser?.role === "admin";

  // ── Persist conversations per user in localStorage ──
  useEffect(() => {
    if (currentUser) {
      saveUserConversations(currentUser.username, conversations);
    }
  }, [conversations, currentUser]);

  useEffect(()=>{
    if (!currentUser) return;
    const check=()=>apiFetch(`${API}/status`).then(r=>r.json()).then(setStatus).catch(()=>setStatus(null));
    check();const t=setInterval(check,8000);return()=>clearInterval(t);
  },[currentUser]);

  const handleFiltersLoaded = useCallback((fil)=>{
    setFilters(prev=>{
      if(JSON.stringify(prev)===JSON.stringify(fil)) return prev;
      return fil;
    });
  },[]);

  const handleLogin = (user) => {
    setCurrentUser(user);
    // Load this user's persisted conversations
    setConversations(loadUserConversations(user.username));
    // L'Administrateur gere les acces, il n'a pas de conversations agent ni
    // de tableau de bord metier -- atterrit directement sur Administration.
    setPage(user.role === "admin" ? "admin" : "dashboard");
  };

  const handleLogout = () => {
    apiFetch(`${API}/logout`, {method:"POST"}).catch(()=>{});
    sessionStorage.removeItem("mae_token");
    clearSession();
    setCurrentUser(null);
    setPage("dashboard");
    setConversations([]);
    setActiveConvId(null);
  };

  const handleNewChat = (firstMsg=null) => {
    const id=`conv_${Date.now()}`;
    const title=firstMsg?genTitle(firstMsg):"Nouvelle conversation";
    setConversations(prev=>[{id,title,msgs:[],apiHistory:[],createdAt:new Date().toISOString()},...prev]);
    setActiveConvId(id);setPage("agent");return id;
  };

  const handleUpdateConv = (convId,newMsgs,newApiHistory) => {
    setConversations(prev=>prev.map(c=>{
      if(c.id!==convId) return c;
      let title=c.title;
      if(title==="Nouvelle conversation"){const fm=newMsgs.find(m=>m.type==="user");if(fm) title=genTitle(fm.text);}
      return{...c,msgs:newMsgs,apiHistory:newApiHistory,title};
    }));
  };

  const handleDeleteConv = (convId) => {
    setConversations(prev=>{
      const updated=prev.filter(c=>c.id!==convId);
      if(activeConvId===convId) setActiveConvId(updated.length>0?updated[0].id:null);
      return updated;
    });
  };

  if (!currentUser) return <LoginPage onLogin={handleLogin}/>;

  // Separation stricte des roles : l'Administrateur gere UNIQUEMENT les
  // acces (principe du moindre privilege -- ce n'est pas un utilisateur
  // metier), la Direction Generale voit tout le reste mais jamais
  // Administration. Un seul compte ne voit jamais les deux univers.
  const NAV = isAdmin
    ? [{id:"admin", label:"Administration"}]
    : [
        {id:"dashboard",   label:"Tableau de Bord"},
        {id:"forecast",    label:"Prévisions"},
        {id:"segmentation",label:"Segmentation"},
        {id:"sinistres",   label:"Sinistres & Risque"},
        {id:"monitoring",  label:"Monitoring"},
        {id:"agent",       label:"Agent IA"},
      ];

  return (
    <div className="shell">
      <nav className="sidebar">
        <div className="sb-logo">
          <img src="mae_logo.png" alt="MAE" onError={e=>{e.target.style.display="none"}}/>
          <div><div className="sb-logo-name">MAE Intelligence</div><div className="sb-logo-sub">Aide à la décision</div></div>
        </div>
        <div className="sb-nav">
          <div className="sb-section">Navigation</div>
          {NAV.map(n=>(
            <button key={n.id} className={`sb-item ${page===n.id?"active":""}`}
              onClick={()=>setPage(n.id)}>
              {n.label}
            </button>
          ))}
          {!isAdmin && conversations.length>0&&(
            <>
              <div className="sb-section" style={{marginTop:8}}>Conversations ({conversations.length})</div>
              <button className="new-chat-btn" onClick={()=>handleNewChat(null)}>
                Nouvelle conversation
              </button>
              {conversations.map(conv=>(
                <button key={conv.id} className={`hist-item ${activeConvId===conv.id&&page==="agent"?"active-hist":""}`}
                  onClick={()=>{setActiveConvId(conv.id);setPage("agent");}}>
                  <span className="hist-text">{conv.title}</span>
                  <span className="hist-date">{fmtHistDate(conv.createdAt)}</span>
                  <button className="hist-del" onClick={e=>{e.stopPropagation();handleDeleteConv(conv.id);}}>✕</button>
                </button>
              ))}
            </>
          )}
          {!isAdmin && conversations.length===0&&page==="agent"&&(
            <>
              <div className="sb-section" style={{marginTop:8}}>Conversations</div>
              <button className="new-chat-btn" onClick={()=>handleNewChat(null)}>
                Nouvelle conversation
              </button>
              <div className="hist-empty">Aucune conversation</div>
            </>
          )}
        </div>
        <div className="sb-footer">
          <div className="sb-user">
            <div style={{flex:1,minWidth:0}}>
              <div className="sb-user-name">{currentUser.name}</div>
              <div className="sb-user-role">{isAdmin?"Administrateur":"Direction Générale"}</div>
            </div>
            <button className="sb-logout" onClick={handleLogout} title="Déconnexion">↩</button>
          </div>
          <div className="sb-status">
            <div className="pulse" style={{background:status?"#4cba6a":"#d93025"}}/>
            {status?`Live · ${status.total_contrats?.toLocaleString()||0} contrats`:"Backend offline"}
          </div>
          {status&&<div style={{fontSize:10,color:"rgba(255,255,255,0.5)",marginTop:4,fontFamily:"'JetBrains Mono',monospace"}}>+{status.total_generated||0} générés</div>}
          {!isAdmin && status?.drift_alert_active && (
            <button onClick={()=>setPage("monitoring")} title="Voir le détail dans Monitoring"
              style={{display:"flex",alignItems:"center",gap:6,marginTop:8,padding:"6px 10px",
                background:"rgba(217,48,37,0.18)",border:"1px solid rgba(217,48,37,0.4)",borderRadius:8,
                color:"#ffb4ac",fontSize:10.5,fontWeight:600,fontFamily:"inherit",cursor:"pointer",width:"100%",
                textAlign:"left"}}>
              Dérive données ({status.drift_ecart_pct>0?"+":""}{status.drift_ecart_pct}%)
            </button>
          )}
        </div>
      </nav>

      <main className="main">
        {isAdmin ? (
          // L'Administrateur ne voit QUE cette page -- jamais les pages
          // metier, quelle que soit la valeur de `page` (defense en
          // profondeur : meme si un bug remettait `page` a une valeur
          // metier, cette branche ne rend jamais rien d'autre qu'AdminPage).
          <AdminPage/>
        ) : (
          <>
            {/* Forecast et Segmentation retires (remarque utilisateur) : ni
                /api/forecast ni /api/segments n'acceptent de parametres de
                filtre (prevision et clustering calcules sur le portefeuille
                entier) -- la barre s'affichait sans le moindre effet sur ces
                deux pages. */}
            {page!=="agent"&&page!=="monitoring"&&page!=="sinistres"&&page!=="forecast"&&page!=="segmentation"&&(
              <Filters filters={filters} values={fVals}
                onChange={(k,v)=>setFVals(p=>({...p,[k]:v}))}
                onReset={()=>setFVals({agence:"all",region:"all",branche:"all",mois:0})}/>
            )}
            {page==="dashboard"    && <Dashboard filterVals={fVals} onFiltersLoaded={handleFiltersLoaded}/>}
            {page==="forecast"     && <Forecast/>}
            {page==="segmentation" && <Segmentation/>}
            {page==="sinistres"    && <SinistresRisque/>}
            {page==="monitoring"   && <Monitoring/>}
            {page==="agent"        && <Agent conversations={conversations} activeConvId={activeConvId}
                onNewChat={handleNewChat} onSelectConv={id=>{setActiveConvId(id);setPage("agent");}}
                onDeleteConv={handleDeleteConv} onUpdateConv={handleUpdateConv}/>}
          </>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
