name: Tests

# Lance la suite pytest de mae_backend/ a chaque push/PR. N'a besoin d'aucun
# secret (GROQ_API_KEY n'est requis qu'a l'instanciation de MAEAgent, jamais
# a l'import de main.py/agent.py -- voir test_main.py) ; RAG/PDF sont
# volontairement absents de mae_backend/requirements.txt (voir ce fichier)
# donc le code degrade proprement (RAG_AVAILABLE=False) au lieu d'echouer.
"on":
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mae_backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: mae_backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest test_main.py -v

  # CD : construit et publie les deux images Docker sur GitHub Container
  # Registry a chaque push sur master, mais seulement si les tests ci-dessus
  # passent (needs: test) -- la partie "livraison continue" de CI/CD, le
  # projet n'ayant pas de serveur de production sur lequel deployer
  # automatiquement (voir Chapitre 7 du rapport).
  docker-publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mae_backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mae-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: mae_frontend
          file: mae_frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mae-frontend:latest
