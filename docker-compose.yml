# Lance le backend (FastAPI + agent) et le frontend (page statique) ensemble.
# Le frontend appelle l'API depuis le NAVIGATEUR (http://localhost:8000, voir
# mae_frontend/index.html: DEFAULT_API) -- pas de reseau Docker interne a
# configurer entre les deux services, chacun expose simplement son port.
#
#   docker compose up --build
services:
  backend:
    build:
      context: .
      dockerfile: mae_backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - mae_backend/.env

  frontend:
    build:
      context: mae_frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
